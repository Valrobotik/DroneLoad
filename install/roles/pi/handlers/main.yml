- name: Redémarrer mosquitto
  ansible.builtin.systemd_service:
    name: mosquitto
    state: restarted
  when: systemd_actif.stat.exists | default(false)

- name: Recharger udev
  ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=gpio --subsystem-match=dma_heap
  when: systemd_actif.stat.exists | default(false)
