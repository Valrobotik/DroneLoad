# Socle commun à tous les environnements : ROS 2, MAVROS, Foxglove bridge, venv Python.

- name: Paquets de base
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - git
      - locales
      - python3-pip
      - python3-venv
    update_cache: true

- name: Locale UTF-8 (requise par ROS 2)
  ansible.builtin.command: locale-gen en_US.UTF-8
  changed_when: false

- name: Dépôt apt ROS 2 (paquet officiel ros2-apt-source)
  ansible.builtin.apt:
    deb: "https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ros_apt_source_version }}/ros2-apt-source_{{ ros_apt_source_version }}.{{ ansible_distribution_release }}_all.deb"

- name: ROS 2, MAVROS, Foxglove bridge, OpenCV système
  ansible.builtin.apt:
    name:
      - "ros-{{ ros_distro }}-ros-base"
      - "ros-{{ ros_distro }}-mavros"
      - "ros-{{ ros_distro }}-mavros-extras"
      - "ros-{{ ros_distro }}-foxglove-bridge"
      - ros-dev-tools
      - python3-opencv
    update_cache: true

- name: Datasets GeographicLib (requis par MAVROS)
  ansible.builtin.command: "/opt/ros/{{ ros_distro }}/lib/mavros/install_geographiclib_datasets.sh"
  args:
    creates: /usr/share/GeographicLib/geoids

- name: rosdep init
  ansible.builtin.command: rosdep init
  args:
    creates: /etc/ros/rosdep/sources.list.d/20-default.list

- name: rosdep update
  ansible.builtin.command: rosdep update --rosdistro {{ ros_distro }}
  become: false
  changed_when: false

- name: Venv Python du projet (voit rclpy et OpenCV système)
  ansible.builtin.pip:
    requirements: "{{ droneload_requirements }}"
    virtualenv: "{{ droneload_venv }}"
    virtualenv_command: python3 -m venv
    virtualenv_site_packages: true

- name: Environnement ROS 2 dans tous les shells
  ansible.builtin.copy:
    dest: /etc/profile.d/droneload.sh
    content: |
      . /opt/ros/{{ ros_distro }}/setup.sh
      export PATH={{ droneload_venv }}/bin:$PATH
    mode: "0644"

- name: Environnement ROS 2 dans les shells interactifs non-login
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    line: . /etc/profile.d/droneload.sh
