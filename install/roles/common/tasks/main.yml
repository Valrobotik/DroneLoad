# Socle commun à tous les environnements : ROS 2, MAVROS, Foxglove bridge, venv Python (YOLO, MQTT).

- name: Dossier d'état DroneLoad
  ansible.builtin.file:
    path: /var/lib/droneload
    state: directory
    mode: "0755"

# Photo des paquets présents avant la première installation (système de base) :
# install/check.py ne signale que ce qui a été ajouté ensuite hors d'Ansible.
- name: Paquets apt du système de base (une seule fois)
  ansible.builtin.shell: apt-mark showmanual > /var/lib/droneload/apt-base.txt
  args:
    creates: /var/lib/droneload/apt-base.txt

- name: Paquets du socle (install/packages.yml, section socle)
  ansible.builtin.apt:
    name: "{{ socle.apt }}"
    update_cache: true

- name: Locale UTF-8 (requise par ROS 2)
  ansible.builtin.command: locale-gen en_US.UTF-8
  changed_when: false

- name: Dépôt apt ROS 2 (paquet officiel ros2-apt-source)
  ansible.builtin.apt:
    deb: "https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ros_apt_source_version }}/ros2-apt-source_{{ ros_apt_source_version }}.{{ ansible_distribution_release }}_all.deb"

- name: Paquets apt communs (install/packages.yml, section commun)
  ansible.builtin.apt:
    name: "{{ commun.apt }}"
    update_cache: true

- name: Datasets GeographicLib (requis par MAVROS)
  ansible.builtin.command: "/opt/ros/{{ ros_distro }}/lib/mavros/install_geographiclib_datasets.sh"
  args:
    creates: /usr/share/GeographicLib/geoids

- name: rosdep init
  ansible.builtin.command: rosdep init
  args:
    creates: /etc/ros/rosdep/sources.list.d/20-default.list

- name: rosdep update
  ansible.builtin.command: rosdep update --rosdistro {{ ros_distro }}
  become: false
  changed_when: false

# Sur arm64, le torch de PyPI (tiré par ultralytics) embarque CUDA : plusieurs Go inutiles
# (Pi, Mac). Installé avant ultralytics, qui le considère alors comme satisfait.
- name: PyTorch CPU
  ansible.builtin.pip:
    name:
      - torch==2.15.0
      - torchvision==0.29.2
    extra_args: --index-url https://download.pytorch.org/whl/cpu
    virtualenv: "{{ droneload_venv }}"
    virtualenv_command: python3 -m venv
    virtualenv_site_packages: true

- name: Paquets pip communs dans le venv, qui voit rclpy et OpenCV système (section commun)
  ansible.builtin.pip:
    name: "{{ commun.pip }}"
    virtualenv: "{{ droneload_venv }}"
    virtualenv_command: python3 -m venv
    virtualenv_site_packages: true

# ultralytics tire opencv-python (pip, sans GStreamer), qui masquerait python3-opencv (apt)
- name: Retrait d'opencv-python du venv (OpenCV système avec GStreamer)
  ansible.builtin.pip:
    name:
      - opencv-python
      - opencv-python-headless
    state: absent
    virtualenv: "{{ droneload_venv }}"

- name: Vérification de l'OpenCV système dans le venv (GStreamer, NumPy compatible)
  ansible.builtin.command: >-
    {{ droneload_venv }}/bin/python -c
    "import re, cv2; assert re.search(r'GStreamer:\s+YES', cv2.getBuildInformation()), cv2.__file__"
  changed_when: false

# colcon lancé par le Python du venv : les nœuds du drone (#!python) voient alors les paquets du venv
# (ultralytics, paho-mqtt). Le venv est en tête du PATH, donc `colcon build` passe par ici.
- name: colcon du venv
  ansible.builtin.copy:
    dest: "{{ droneload_venv }}/bin/colcon"
    content: |
      #!/bin/sh
      exec {{ droneload_venv }}/bin/python3 -m colcon "$@"
    mode: "0755"

- name: Environnement ROS 2 dans tous les shells
  ansible.builtin.copy:
    dest: /etc/profile.d/droneload.sh
    content: |
      . /opt/ros/{{ ros_distro }}/setup.sh
      export PATH={{ droneload_venv }}/bin:$PATH
      # Paquets ROS 2 du drone, une fois construits (cd drone && colcon build --symlink-install)
      if [ -f {{ droneload_repo }}/drone/install/setup.sh ]; then
        . {{ droneload_repo }}/drone/install/setup.sh
      fi
    mode: "0644"

- name: Environnement ROS 2 dans les shells interactifs non-login
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    line: . /etc/profile.d/droneload.sh
