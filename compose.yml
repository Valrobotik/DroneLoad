# Simulation DroneLoad. À lancer depuis la racine du repo (voir docs/simulation.md).
#   Mac         : docker compose up -d
#   Linux       : docker compose -f compose.yml -f compose.linux.yml up -d
#   Linux + GPU : ajouter -f compose.gpu.yml
#   Options     : --profile gui (GUI Gazebo web), --profile foxglove
#
# Tous les services partagent l'espace réseau de gz-server (Linux : celui de l'hôte) :
# ils se parlent sur 127.0.0.1, sans aucune IP fixe.

x-ros: &ros
  image: droneload-base
  build: &build-base
    context: .
    dockerfile: docker/ros.Dockerfile
    target: base
  network_mode: service:gz-server
  # Mémoire partagée commune : DDS transporte les images par mémoire partagée entre conteneurs
  ipc: service:gz-server
  depends_on: [gz-server]
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    GZ_PARTITION: ${GZ_PARTITION:-droneload}
  volumes:
    - .:/workspace
  init: true

x-build-sim: &build-sim
  context: .
  dockerfile: docker/ros.Dockerfile
  target: sim

services:
  # Serveur Gazebo headless (rendu des caméras en EGL). Possède l'espace réseau et publie les ports,
  # uniquement sur 127.0.0.1 (pas accessibles depuis le réseau local).
  gz-server:
    image: droneload-sim
    build: *build-sim
    command: gz sim -s -r --headless-rendering /workspace/sim/worlds/voliere.sdf
    environment: *ros-env
    ipc: shareable
    volumes:
      - .:/workspace
    init: true
    ports:
      - "127.0.0.1:5760:5760"   # MAVLink TCP (QGroundControl)
      - "127.0.0.1:8765:8765"   # Foxglove bridge
      - "127.0.0.1:6901:6901"   # GUI Gazebo (KasmVNC)
      - "127.0.0.1:1883:1883"   # broker MQTT (dashboard)

  # Autopilote ArduCopter : physique via Gazebo (JSON, UDP 9002), MAVLink TCP 5760 (QGC) et UDP 14550 (MAVROS).
  # -w : eeprom effacée à chaque démarrage, les paramètres viennent toujours des fichiers .parm.
  sitl:
    image: droneload-sitl:${ARDUPILOT_TAG}
    build:
      context: .
      dockerfile: docker/sitl.Dockerfile
      args:
        ARDUPILOT_TAG: ${ARDUPILOT_TAG}
    network_mode: service:gz-server
    depends_on: [gz-server]
    volumes:
      - ./autopilot:/workspace/autopilot:ro
    init: true
    command: >
      arducopter --model JSON --sim-address 127.0.0.1 --speedup 1 -I0 -w
      --home 45.7838,4.8722,170,0
      --defaults /opt/ardupilot/params/copter.parm,/workspace/autopilot/params/drone.parm,/workspace/autopilot/params/sitl.parm
      --serial0 tcp:0
      --serial1 udpclient:127.0.0.1:14550

  # Liaison ROS 2 <-> autopilote. Sur le drone : fcu_url:=/dev/ttyAMA0:921600
  mavros:
    <<: *ros
    command: ros2 launch mavros apm.launch fcu_url:=udp://:14550@

  # Capteurs simulés Gazebo -> topics ROS 2 (sur le drone : nœuds drivers)
  bridge:
    <<: *ros
    image: droneload-sim
    build: *build-sim
    command: ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=/workspace/sim/bridge.yaml

  # Conteneur de développement : docker compose exec companion bash
  companion:
    <<: *ros
    command: sleep infinity
    stdin_open: true
    tty: true

  # Broker MQTT, même rôle que le mosquitto de la Pi (dashboard.py --broker localhost)
  mqtt:
    image: eclipse-mosquitto:2.0.22
    network_mode: service:gz-server
    depends_on: [gz-server]
    volumes:
      - ./sim/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  foxglove:
    <<: *ros
    profiles: [foxglove]
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765 address:=0.0.0.0

  # GUI Gazebo dans le navigateur : http://localhost:6901 (rendu logiciel sur Mac, 5-10 FPS)
  gz-gui:
    <<: *ros
    image: droneload-gui
    build:
      context: .
      dockerfile: docker/ros.Dockerfile
      target: gui
    profiles: [gui]
    command: /workspace/docker/gui.sh
