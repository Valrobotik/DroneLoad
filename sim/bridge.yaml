# ros_gz_bridge : capteurs simulés Gazebo -> topics ROS 2 (mêmes noms que les futurs nœuds drivers du drone).
- ros_topic_name: /clock
  gz_topic_name: /world/voliere/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# Caméra Module 3 (vers le sol)
- ros_topic_name: /camera/image_raw
  gz_topic_name: /camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /camera/camera_info
  gz_topic_name: /camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# Caméra de profondeur type RealSense
- ros_topic_name: /stereo/color/image_raw
  gz_topic_name: /stereo/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /stereo/depth/image_raw
  gz_topic_name: /stereo/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /stereo/camera_info
  gz_topic_name: /stereo/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# Vérité terrain : pose du drone dans le monde Gazebo (ENU, comme le repère map de MAVROS).
# Pour le capteur UWB simulé (sim/scripts/uwb_sim.py) et les tests ; jamais utilisée par le code du drone.
- ros_topic_name: /sim/drone/pose
  gz_topic_name: /model/drone/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS
