# Override « limites de la Pi 5 » : le conteneur companion (où tourne le code du drone) est plafonné
# en CPU et en RAM, pour repérer un code qui tient le temps réel sur le PC mais pas sur la Pi.
#   docker compose -f compose.yml -f compose.pi.yml up -d    (Linux : ajouter compose.linux.yml avant)
# PI_CPUS et PI_MEM sont dans .env. PI_CPUS est un budget de temps CPU, pas une vitesse de cœur :
# le régler avec scripts/bench_cpu.py (voir docs/simulation.md, « Limites de la Pi »).
services:
  companion:
    cpus: ${PI_CPUS}
    mem_limit: ${PI_MEM}
    memswap_limit: ${PI_MEM}   # = mem_limit : pas de swap, la Pi n'en a pas
