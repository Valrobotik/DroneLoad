# Override Linux : réseau de l'hôte (DDS et gz-transport visibles depuis l'hôte, GUI Gazebo native possible).
x-host: &host
  network_mode: host

services:
  gz-server:
    <<: *host
    ports: !reset []
  sitl: *host
  mavros: *host
  bridge: *host
  companion: *host
  drone:
    <<: *host
    environment:
      PC_IP: 127.0.0.1   # flux vidéo vers l'hôte (pas de host.docker.internal en réseau hôte)
  mqtt: *host
  foxglove: *host
  gz-gui: *host
